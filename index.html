<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter Mind V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #e8c547;
    --accent2: #7b5ea7;
    --accent3: #4ade80;
    --text: #e8e8f0;
    --text-muted: #6b6b85;
    --user-bg: #1e1e2e;
    --agent-bg: #151520;
    --radius: 12px;
    --font-mono: 'Space Mono', monospace;
    --font-sans: 'Syne', sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: grid;
    grid-template-columns: var(--sidebar-w, 380px) 4px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  /* â”€â”€ TOPBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 16px;
  }
  .logo {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo-v {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 2px;
    letter-spacing: 0;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
  .model-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  .status-dot.active { background: var(--accent3); box-shadow: 0 0 6px #4ade80aa; }
  /* â”€â”€ SIDEBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  aside {
    grid-column: 1;
    grid-row: 2;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 200px;
  }
  .v-resizer {
    grid-row: 2; grid-column: 2;
    background: var(--border);
    cursor: col-resize;
    transition: background 0.15s;
    z-index: 10;
  }
  .v-resizer:hover, .v-resizer.dragging { background: var(--accent); }
  .h-resizer {
    height: 5px;
    background: var(--border);
    cursor: row-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .h-resizer:hover, .h-resizer.dragging { background: var(--accent2); }
  /* â”€â”€ SHARED SIDEBAR COMPONENTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .s-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
  }
  input[type="password"], input[type="text"], select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 11px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  .row-pair { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 8px 11px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row .s-label { min-width: 80px; white-space: nowrap; }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    padding: 0; border: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }
  .slider-val {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }
  /* â”€â”€ CONFIG BLOCK (collapsible) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .config-block {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .config-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .config-toggle:hover { background: var(--surface2); }
  .config-toggle .s-label { flex: 1; }
  .chevron {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .config-block.collapsed .chevron { transform: rotate(-90deg); }
  .config-body {
    overflow: hidden;
    transition: max-height 0.25s ease;
    max-height: 300px;
  }
  .config-block.collapsed .config-body { max-height: 0; }
  .config-inner { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  /* â”€â”€ PROMPT BLOCKS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .prompt-block {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 80px;
  }
  .prompt-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 8px;
    flex-shrink: 0;
  }
  .prompt-header .s-label { flex: 1; }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent3);
    box-shadow: 0 0 5px #4ade80aa;
    flex-shrink: 0;
  }
  .char-count {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.55;
  }
  .prompt-ta {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 12px;
    resize: none;
    outline: none;
    line-height: 1.65;
    transition: border-color 0.15s;
    margin: 0 16px 12px;
  }
  .prompt-ta:focus { border-color: var(--accent2); }
  #fixed-prompt:focus { border-color: var(--accent); }
  /* â”€â”€ DYNAMIC PROMPT EXTRAS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .dynamic-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 80px;
  }
  .beat-row {
    display: flex;
    gap: 6px;
    padding: 0 16px 8px;
    flex-shrink: 0;
  }
  .beat-row select { font-size: 11px; }
  /* â”€â”€ DOC LOADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .doc-loader {
    padding: 8px 16px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent) 3%, var(--surface));
  }
  .doc-loader-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .doc-loader-label {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .fetch-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .fetch-btn:hover { filter: brightness(1.1); }
  .fetch-btn.loading { opacity: 0.6; cursor: not-allowed; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .file-fallback {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-fallback-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .file-fallback-label:hover { opacity: 1; }
  .doc-status {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 0;
    flex-shrink: 0;
    min-height: 14px;
  }
  .doc-status.ok { color: var(--accent3); }
  .doc-status.err { color: #ff8888; }
  .doc-status.info { color: var(--text-muted); }
  .reload-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .reload-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  /* â”€â”€ KEYPOINTS PANEL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .keypoints-panel {
    flex-shrink: 0;
    background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    border-bottom: 2px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    padding: 8px 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .keypoints-panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .keypoints-panel-header .s-label { color: var(--accent); flex: 1; letter-spacing: 2px; }
  .kp-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1;
    transition: color 0.15s;
  }
  .kp-close:hover { color: var(--accent); }
  .keypoints-box {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--accent);
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0.9;
  }
  .separator-preview {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    padding: 2px 16px 4px;
    opacity: 0.45;
    flex-shrink: 0;
  }
  /* â”€â”€ START MESSAGE BLOCK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .start-msg-block {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent3) 4%, var(--surface));
  }
  .start-msg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px 4px;
  }
  .start-msg-ta {
    margin: 0 16px 10px;
    min-height: 56px;
    max-height: 110px;
    border-color: color-mix(in srgb, var(--accent3) 30%, var(--border)) !important;
    resize: vertical;
  }
  .start-msg-ta:focus { border-color: var(--accent3) !important; }
  /* â”€â”€ MAIN CHAT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  main {
    grid-column: 3;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  .msg {
    display: flex;
    gap: 14px;
    max-width: 820px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    font-family: var(--font-sans);
    font-weight: 800;
  }
  .msg.user .avatar      { background: var(--accent);  color: var(--bg); }
  .msg.assistant .avatar { background: var(--accent2); color: #fff; }
  .bubble {
    padding: 13px 17px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    max-width: 680px;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid #2a2a3e;
    border-top-right-radius: 3px;
  }
  .msg.assistant .bubble {
    background: var(--agent-bg);
    border: 1px solid var(--border);
    border-top-left-radius: 3px;
  }
  .bubble pre {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    overflow-x: auto;
    margin: 10px 0;
    line-height: 1.5;
  }
  .bubble code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: #0d0d14;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .bubble pre code { background: none; padding: 0; }
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: pulse 1.2s ease infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1); }
  }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0.3;
    pointer-events: none;
    user-select: none;
  }
  .empty-state .big-icon { font-size: 48px; }
  .empty-state p {
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
    color: var(--text-muted);
  }
  /* â”€â”€ INPUT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 14px 20px 18px;
    background: var(--surface);
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color 0.15s;
  }
  .input-row:focus-within { border-color: var(--accent); }
  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    max-height: 160px;
    min-height: 24px;
  }
  #user-input::placeholder { color: var(--text-muted); }
  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    width: 38px; height: 38px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--bg);
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 18px;
  }
  .send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn-small {
    border: none;
    border-radius: 7px;
    width: 38px; height: 27px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 700;
  }
  .send-btn-small:hover { filter: brightness(1.15); transform: scale(1.05); }
  .send-btn-small:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn-small.monkey { background: var(--accent3); color: var(--bg); }
  .send-btn-small.human  { background: var(--accent2); color: #fff; }
  .input-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 7px;
    padding: 0 2px;
  }
  .input-hint  { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); opacity: 0.5; }
  .token-count { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .beat-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent2);
    background: #1e1630;
    border: 1px solid var(--accent2);
    padding: 3px 9px;
    border-radius: 4px;
    opacity: 0.9;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reply-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.5;
    margin-top: 6px;
    text-align: right;
  }
  .msg.user .reply-meta { text-align: left; }
  .error-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #3a1a1a;
    border: 1px solid #7a2a2a;
    color: #ff8888;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 18px;
    border-radius: 8px;
    z-index: 100;
    animation: fadeUp 0.2s ease;
  }
  .sys-preview-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    cursor: pointer;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    user-select: none;
  }
  .sys-preview-row:hover { background: var(--surface2); }
  .sys-preview-chars { font-family: var(--font-mono); font-size: 9px; color: var(--accent); margin-left: auto; }
  .sys-preview-box {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    background: #0d0d14;
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    flex-shrink: 0;
  }
  /* â”€â”€ CHARACTER TABS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  .char-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .char-tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .char-tab:hover { color: var(--text); background: var(--surface2); }
  .char-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .char-tab[data-char="monkey"].active { color: var(--accent3); border-bottom-color: var(--accent3); }
  .char-tab[data-char="human"].active  { color: var(--accent2); border-bottom-color: var(--accent2); }
  .char-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
  .char-panel.active { display: flex; }
  .puppet-prompt-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 80px;
  }
  .puppet-out-box {
    margin: 0 16px 14px;
    padding: 11px 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    min-height: 48px;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .puppet-out-box.empty { color: var(--text-muted); opacity: 0.6; }
  .puppet-out-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 6px;
    flex-shrink: 0;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>

  // â”€â”€ Apps Script loader via JSONP (bypasses Wix iframe CORS/CSP) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function loadFromDoc() {
    const url = document.getElementById('doc-id').value.trim();
    if (!url) { setDocStatus('Paste the Apps Script URL above', 'err'); return; }
    localStorage.setItem('pm_v2_script_url', url);

    const btn = document.getElementById('fetch-btn');
    btn.textContent = 'â†º'; btn.classList.add('loading'); btn.disabled = true;
    setDocStatus('Fetching scriptâ€¦', 'info');

    const cbName = 'apsCb_' + Date.now();
    const tag = document.createElement('script');

    const cleanup = (ok) => {
      delete window[cbName];
      if (tag.parentNode) tag.remove();
      btn.classList.remove('loading'); btn.disabled = false; btn.textContent = 'â†º Fetch';
    };

    window[cbName] = function(data) {
      cleanup();
      if (data && data.text) {
        parseDocBeats(data.text);
      } else {
        setDocStatus('Empty response â€” check script', 'err');
      }
    };

    tag.onerror = function() {
      cleanup();
      setDocStatus('Load failed â€” check Apps Script URL', 'err');
    };

    tag.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.head.appendChild(tag);
  }

  // â”€â”€ Local file fallback â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function loadFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    setDocStatus('Reading ' + file.name + 'â€¦', 'info');
    const reader = new FileReader();
    reader.onload = e => {
      parseDocBeats(e.target.result);
      if (Object.keys(beats).length > 0)
        setDocStatus('âœ“ ' + file.name + ' â€” ' + Object.keys(beats).length + ' beats', 'ok');
    };
    reader.onerror = () => setDocStatus('Failed to read file', 'err');
    reader.readAsText(file);
    event.target.value = '';
  }

  // â”€â”€ Parse @@ markers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function parseDocBeats(text) {
    text = text.replace(/^ï»¿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const parts = text.split(/\n?(?=^@@)/m);
    beats = {};
    startMessages = {};
    keypoints = {};
    const names = [];
    let fixedLoaded = false;

    for (const part of parts) {
      const trimmed = part.trim();
      if (!trimmed.startsWith('@@')) continue;
      const firstNewline = trimmed.indexOf('\n');
      if (firstNewline === -1) continue;
      const tag  = trimmed.slice(2, firstNewline).trim();
      let   body = trimmed.slice(firstNewline + 1).trim();
      if (!tag || tag.toUpperCase() === 'END') continue;

      // Extract %%keypoints...%% (for display only, not sent to AI)
      const kpMatch = body.match(/%%keypoints\s*([\s\S]*?)%%/i);
      const kpText  = kpMatch ? kpMatch[1].trim() : '';
      body = body.replace(/%%keypoints\s*[\s\S]*?%%/i, '').trim();
      const startMsgMatch = body.match(/\$\$START_MESSAGE([\s\S]*?)\$\$/);
      const startMsg = startMsgMatch ? startMsgMatch[1].trim() : '';
      body = body.replace(/\$\$START_MESSAGE[\s\S]*?\$\$/, '').trim();

      if (tag.toLowerCase() === 'fixed_prompt') {
        document.getElementById('fixed-prompt').value = body;
        document.getElementById('fixed-chars').textContent = body.length;
        fixedLoaded = true;
      } else {
        beats[tag] = body;
        startMessages[tag] = startMsg;
        keypoints[tag] = kpText;
        names.push(tag);
      }
    }

    // Rebuild beat selector
    const sel = document.getElementById('beat-select');
    sel.innerHTML = '<option value="__manual__">â€” manual â€”</option>';
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      sel.appendChild(opt);
    });
    if (names.length > 0) { sel.value = names[0]; onBeatChange(); }

    // Collapse config, update preview, show status
    document.getElementById('config-block').classList.add('collapsed');
    updatePreview();
    const beatMsg  = names.length > 0 ? `${names.length} beats` : 'no beats';
    const fixedMsg = fixedLoaded ? ' Â· fixed prompt loaded' : '';
    setDocStatus('âœ“ ' + beatMsg + fixedMsg, 'ok');

    // Update empty-state hint now that script is loaded
    const es = document.getElementById('empty-state');
    if (es) es.querySelector('p').innerHTML =
      'Script loaded â€” set the beat<br>and start the conversation.';
  }

  // â”€â”€ Transcript download â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function downloadTranscript() {
    if (eventLog.length === 0) return;
    const beat  = document.getElementById('beat-select').value;
    const scene = beat === '__manual__' ? 'manual' : beat;
    const now   = new Date();
    const stamp = now.toISOString().slice(0,16).replace('T','_').replace(':','-');
    const lines = [];
    lines.push('PETER MIND â€” TRANSCRIPT');
    lines.push('Scene: ' + scene);
    lines.push('Date: ' + now.toLocaleString());
    lines.push('Model: ' + document.getElementById('model-select').value);
    lines.push('='.repeat(60));
    lines.push('');
    let lastLine = null;
    for (const ev of eventLog) {
      const inputSpeaker = ev.inputSpeaker || 'Amir';
      if (ev.input !== lastLine) {
        lines.push(`${inputSpeaker.toUpperCase()}:`);
        lines.push(ev.input);
        lines.push('');
      }
      lines.push(`${ev.speaker.toUpperCase()}:`);
      lines.push(ev.reply);
      lines.push('');
      lastLine = ev.reply;
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `peter_${scene}_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  }
  function setStatus(active) {
    document.getElementById('status-dot').className = 'status-dot' + (active ? ' active' : '');
  }
  function showError(msg) {
    document.querySelector('.error-toast')?.remove();
    const el = document.createElement('div');
    el.className = 'error-toast'; el.textContent = 'âš  ' + msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function appendMessage(role, content) {
    document.getElementById('empty-state')?.remove();
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div'); div.className = 'msg ' + role;
    const av   = document.createElement('div'); av.className = 'avatar';
    av.textContent = role === 'user' ? 'U' : 'â¬¡';
    const bubble = document.createElement('div'); bubble.className = 'bubble';
    bubble.innerHTML = formatMessage(content);
    div.appendChild(av); div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return bubble;
  }

  function formatMessage(text) {
    return text
      .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) =>
        `<pre><code>${esc(c.trim())}</code></pre>`)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
      .replace(/\n/g, '<br>');
  }
  function esc(str) {
    return str.replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showTyping() {
    document.getElementById('empty-state')?.remove();
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg assistant'; div.id = 'typing-msg';
    const av = document.createElement('div'); av.className = 'avatar'; av.textContent = 'â¬¡';
    const b  = document.createElement('div'); b.className = 'bubble';
    b.innerHTML = `<div class="typing-indicator">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>`;
    div.appendChild(av); div.appendChild(b);
    msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
  }
  function removeTyping() { document.getElementById('typing-msg')?.remove(); }

  // â”€â”€ Send start message â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function sendStartMessage() {
    const msg = document.getElementById('start-message').value.trim();
    if (!msg) return;
    const inp = document.getElementById('user-input');
    inp.value = msg; autoResize(inp);
    sendMessage();
  }

  // â”€â”€ Send to Peter â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function sendMessage() {
    const apiKey = ANTHROPIC_API_KEY || document.getElementById('api-key').value.trim();
    if (!apiKey) { showError('Please enter your Anthropic API key'); return; }
    const userInput = document.getElementById('user-input');
    const text = userInput.value.trim();
    if (!text) return;
    const model     = document.getElementById('model-select').value;
    const temp      = parseFloat(document.getElementById('temperature').value);
    const maxTokens = parseInt(document.getElementById('max-tokens').value);
    const sysPrompt = buildSystemPrompt();

    conversation.push({ role: 'user', content: text });
    appendMessage('user', text);
    userInput.value = ''; userInput.style.height = 'auto';
    updateCount();
    document.getElementById('send-btn').disabled = true;
    setStatus(true); showTyping();
    const t0 = Date.now();

    try {
      const body = { model, max_tokens: maxTokens, temperature: temp, messages: conversation };
      if (sysPrompt) body.system = sysPrompt;
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'API error ' + res.status);
      const reply    = data.content?.[0]?.text || '';
      const duration = ((Date.now() - t0) / 1000).toFixed(1);
      conversation.push({ role: 'assistant', content: reply });
      eventLog.push({ time: new Date(), speaker: 'Peter', inputSpeaker: 'Amir', input: text, reply });
      removeTyping();
      const bubble = appendMessage('assistant', reply);
      const meta = document.createElement('div');
      meta.className = 'reply-meta'; meta.textContent = duration + 's';
      bubble.appendChild(meta);
      updateCount();
    } catch(err) {
      removeTyping(); showError(err.message); conversation.pop(); updateCount();
    } finally {
      document.getElementById('send-btn').disabled = false; setStatus(false);
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  // â”€â”€ Puppet helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function clearPuppetOutput(name) {
    const box = document.getElementById(name + '-output');
    box.textContent = 'No reply yetâ€¦'; box.classList.add('empty');
  }
  function setPuppetOutput(name, text, isError) {
    const box = document.getElementById(name + '-output');
    box.classList.remove('empty'); box.textContent = text;
    box.style.color = isError ? '#ff8888' : '';
  }

  // â”€â”€ One-shot puppet send â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function sendToPuppet(name) {
    const apiKey = ANTHROPIC_API_KEY || document.getElementById('api-key').value.trim();
    if (!apiKey) { showError('Please enter your Anthropic API key'); return; }
    const userInput = document.getElementById('user-input');
    const typed = userInput.value.trim();
    let text = typed;
    let usedFallback = false;

    if (!text) {
      for (let i = conversation.length - 1; i >= 0; i--) {
        if (conversation[i].role === 'assistant') {
          text = conversation[i].content; usedFallback = true; break;
        }
      }
      if (!text) { showError('Nothing to send â€” type a message or get a reply from Peter first'); return; }
    }

    if (typed) { userInput.value = ''; userInput.style.height = 'auto'; }

    const sysPrompt = document.getElementById(name + '-prompt').value.trim();
    const model     = document.getElementById('model-select').value;
    const temp      = parseFloat(document.getElementById('temperature').value);
    const maxTokens = parseInt(document.getElementById('max-tokens').value);
    const btn = document.getElementById('send-' + name + '-btn');
    btn.disabled = true;
    setPuppetOutput(name, usedFallback ? 'â€¦ reacting to Peter\'s last line' : 'â€¦ thinking', false);
    document.getElementById(name + '-output').classList.add('empty');

    try {
      const body = {
        model, max_tokens: maxTokens, temperature: temp,
        messages: [{ role: 'user', content: text }]
      };
      if (sysPrompt) body.system = sysPrompt;
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'API error ' + res.status);
      const reply = data.content?.[0]?.text || '';
      setPuppetOutput(name, reply, false);
      const speakerLabel = name === 'monkey' ? 'Monkey Puppet' : 'Human Puppet';
      const inputSpeaker = usedFallback ? 'Peter' : 'Amir';
      eventLog.push({ time: new Date(), speaker: speakerLabel, inputSpeaker, input: text, reply });
      updateCount();
    } catch(err) {
      setPuppetOutput(name, 'âš  ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  // â”€â”€ Vertical resizer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  (function() {
    const handle = document.getElementById('v-resizer');
    let dragging = false, startX, startW;
    handle.addEventListener('mousedown', e => {
      dragging = true; startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 380;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const w = Math.max(200, Math.min(650, startW + e.clientX - startX));
      document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    });
    document.addEventListener('mouseup', () => {
      dragging = false; handle.classList.remove('dragging');
      document.body.style.userSelect = ''; document.body.style.cursor = '';
    });
  })();

  // â”€â”€ Horizontal resizer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  (function() {
    const handle  = document.getElementById('h-resizer');
    const fixedEl = document.getElementById('fixed-block');
    let dragging = false, startY, startH;
    handle.addEventListener('mousedown', e => {
      dragging = true; startY = e.clientY; startH = fixedEl.offsetHeight;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'row-resize';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const aside = document.querySelector('aside');
      const maxH  = aside.offsetHeight - 200;
      const h = Math.max(80, Math.min(maxH, startH + e.clientY - startY));
      fixedEl.style.flex = 'none'; fixedEl.style.height = h + 'px';
    });
    document.addEventListener('mouseup', () => {
      dragging = false; handle.classList.remove('dragging');
      document.body.style.userSelect = ''; document.body.style.cursor = '';
    });
  })();
</script>
</body>
